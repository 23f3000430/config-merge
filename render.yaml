services:
  - type: web
    name: config-merge-service
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_WORKERS
        value: "16"
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOG_LEVEL
        value: "debug"
